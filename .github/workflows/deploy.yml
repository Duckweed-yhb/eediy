# 构建 VitePress 站点并部署到 GitHub Pages
name: Build and deploy VitePress site

on:
  # 推送到 main 分支时构建并部署
  push:
    branches: [main]
  # PR 只做构建检查，不部署
  pull_request:
    branches: [main]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 授予 GITHUB_TOKEN 部署到 Pages 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署；进行中的部署不取消，保证生产站点完整发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 用 lockfile 精确安装：PR 里依赖不会漂移，构建结果可复现
      - name: Install dependencies
        run: npm ci

      # 站内链接与锚点先过一遍：断链不会让构建失败，但会让读者点空
      - name: Check internal links and anchors
        run: npm run check:links

      - name: Build with VitePress
        run: npm run docs:build

      # 只有 main 推送和手动触发才上传发布产物；PR 只验证「能不能构建」
      - name: Upload artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    # 部署条件与改动前保持一致：只在 main 推送或手动触发时执行
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
